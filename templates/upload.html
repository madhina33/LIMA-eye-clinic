<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image - LIMA Eye Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f9fd; color: #333; }
        .navbar { background-color: #0d6efd; }
        .navbar-brand, .nav-link { color: #ffffff !important; font-weight: 500; }
        .upload-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(13, 110, 253, 0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-eye me-2"></i>LIMA Eye Clinic</a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict">Disease Prediction</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/upload">Image Upload</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card upload-card p-4">
                    <h3 class="text-center text-primary mb-3"><i class="fas fa-cloud-upload-alt me-2"></i>Upload Retinal Scan</h3>
                    <p class="text-center text-muted small mb-4">Please select a fundus image file (.jpg, .png) for screening analysis.</p>
                    <form action="/upload" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input class="form-control" type="file" name="file" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="fas fa-paper-plane me-2"></i>Predict Result</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
